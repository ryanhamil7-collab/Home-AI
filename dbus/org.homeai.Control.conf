<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="org.homeai.Control"/>
  </policy>

  <!-- Allow homeai-admin group to call methods -->
  <policy group="homeai-admin">
    <allow send_destination="org.homeai.Control"
           send_interface="org.homeai.Control"/>
  </policy>

  <!-- Allow anyone to receive signals -->
  <policy context="default">
    <allow receive_sender="org.homeai.Control"/>
  </policy>
</busconfig>
