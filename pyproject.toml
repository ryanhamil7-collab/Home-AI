[tool.poetry]
name = "home-ai-os"
version = "0.2.0"
description = "AI-Native Linux Desktop Environment with Live Computer Vision"
authors = ["Ryan Hamilton <ryanhamil7@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "home_ai_os", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
PyQt6 = "^6.6.0"
loguru = "^0.7.2"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
cryptography = "^41.0.7"
psutil = "^5.9.6"
mss = "^9.0.1"
Pillow = "^10.1.0"
numpy = "^1.26.2"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
black = "^23.12.0"
ruff = "^0.1.8"
mypy = "^1.7.1"

[tool.poetry.scripts]
homeai = "home_ai_os.main:main"
homeai-gui = "home_ai_os.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
